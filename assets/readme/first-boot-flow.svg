<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="fb fd2">
  <title id="fb">首次启动流程</title>
  <desc id="fd2">uci-defaults/99-router-mode 脚本在系统首次启动或恢复出厂后执行一次:配置 WAN eth0 DHCP 客户端、配置 LAN br-lan 192.168.1.1/24、启用 DHCP 服务器 100-250、启用 WiFi 5G/2.4G WPA2-PSK 加密、清空 root 密码、写入标记文件避免重复执行。</desc>

  <defs>
    <style>
      .bg { fill: #0E1419; }
      .panel { fill: #1A2230; }
      .panel2 { fill: #141A24; }
      .fg { fill: #E8E4D9; }
      .orange { fill: #F89406; }
      .blue { fill: #4A9EFF; }
      .muted { fill: #6B7280; }
      .so { stroke: #F89406; }
      .sb { stroke: #4A9EFF; }
      .sm { stroke: #6B7280; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="320" rx="20" />

  <g transform="translate(56 36)">
    <text class="sans fg" x="0" y="32" font-size="32" font-weight="700">首次启动流程</text>
    <text class="sans muted" x="0" y="62" font-size="16">99-router-mode 脚本执行一次,完成后写标记避免重复</text>
  </g>

  <g transform="translate(56 140)">
    <rect class="panel so" x="0" y="0" width="160" height="100" rx="8" stroke-width="1.5" />
    <text class="mono orange" x="80" y="34" font-size="12" text-anchor="middle" font-weight="600">99-router-mode</text>
    <text class="mono fg" x="80" y="56" font-size="11" text-anchor="middle">uci-defaults</text>
    <text class="mono muted" x="80" y="78" font-size="10" text-anchor="middle">脚本执行一次</text>

    <line class="so" x1="160" y1="50" x2="190" y2="50" stroke-width="1.5" />
    <polygon class="orange" points="190,46 198,50 190,54" />

    <rect class="panel sb" x="200" y="0" width="160" height="100" rx="8" stroke-width="1.5" />
    <text class="mono blue" x="280" y="34" font-size="12" text-anchor="middle" font-weight="600">配置 WAN</text>
    <text class="mono fg" x="280" y="56" font-size="11" text-anchor="middle">eth0</text>
    <text class="mono muted" x="280" y="78" font-size="10" text-anchor="middle">DHCP 客户端</text>

    <line class="sb" x1="360" y1="50" x2="390" y2="50" stroke-width="1.5" />
    <polygon class="blue" points="390,46 398,50 390,54" />

    <rect class="panel sb" x="400" y="0" width="160" height="100" rx="8" stroke-width="1.5" />
    <text class="mono blue" x="480" y="34" font-size="12" text-anchor="middle" font-weight="600">配置 LAN</text>
    <text class="mono fg" x="480" y="56" font-size="11" text-anchor="middle">br-lan</text>
    <text class="mono muted" x="480" y="78" font-size="10" text-anchor="middle">192.168.1.1/24</text>

    <line class="sb" x1="560" y1="50" x2="590" y2="50" stroke-width="1.5" />
    <polygon class="blue" points="590,46 598,50 590,54" />

    <rect class="panel sb" x="600" y="0" width="160" height="100" rx="8" stroke-width="1.5" />
    <text class="mono blue" x="680" y="34" font-size="12" text-anchor="middle" font-weight="600">启用 DHCP</text>
    <text class="mono fg" x="680" y="56" font-size="11" text-anchor="middle">192.168.1.100</text>
    <text class="mono muted" x="680" y="78" font-size="10" text-anchor="middle">- 192.168.1.250</text>
  </g>

  <g transform="translate(56 250)">
    <line class="sb" x1="680" y1="-10" x2="680" y2="14" stroke-width="1.5" />
    <polygon class="blue" points="676,14 680,22 684,14" />

    <rect class="panel sb" x="600" y="14" width="160" height="56" rx="8" stroke-width="1.5" />
    <text class="mono blue" x="680" y="38" font-size="12" text-anchor="middle" font-weight="600">启用 WiFi</text>
    <text class="mono muted" x="680" y="58" font-size="10" text-anchor="middle">5G/2.4G WPA2-PSK</text>

    <line class="sb" x1="760" y1="42" x2="790" y2="42" stroke-width="1.5" />
    <polygon class="blue" points="790,38 798,42 790,46" />

    <rect class="panel so" x="800" y="14" width="160" height="56" rx="8" stroke-width="1.5" />
    <text class="mono orange" x="880" y="38" font-size="12" text-anchor="middle" font-weight="600">清空 root 密码</text>
    <text class="mono muted" x="880" y="58" font-size="10" text-anchor="middle">首次登录后请设置</text>

    <line class="so" x1="960" y1="42" x2="990" y2="42" stroke-width="1.5" />
    <polygon class="orange" points="990,38 998,42 990,46" />

    <rect class="panel so" x="1000" y="14" width="140" height="56" rx="8" stroke-width="1.5" />
    <text class="mono orange" x="1070" y="38" font-size="12" text-anchor="middle" font-weight="600">写标记文件</text>
    <text class="mono muted" x="1070" y="58" font-size="10" text-anchor="middle">避免重复执行</text>
  </g>
</svg>
