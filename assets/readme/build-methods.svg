<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-labelledby="bm bd3">
  <title id="bm">构建方法对比</title>
  <desc id="bd3">四种构建方法对比:Docker 构建(任意装了 Docker 的系统,入口 docker-build.sh)、WSL 构建(Windows 推荐,入口 wsl-build.sh)、GitHub Actions 云构建(Fork 后免费云构建,目录 .github/workflows/)、Linux 本地构建(Debian/Ubuntu,ImageBuilder + make image)。</desc>

  <defs>
    <style>
      .bg { fill: #0E1419; }
      .panel { fill: #1A2230; }
      .panel2 { fill: #141A24; }
      .fg { fill: #E8E4D9; }
      .orange { fill: #F89406; }
      .blue { fill: #4A9EFF; }
      .muted { fill: #6B7280; }
      .so { stroke: #F89406; }
      .sb { stroke: #4A9EFF; }
      .sm { stroke: #6B7280; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="280" rx="20" />

  <g transform="translate(56 36)">
    <text class="sans fg" x="0" y="32" font-size="32" font-weight="700">构建方法对比</text>
    <text class="sans muted" x="0" y="62" font-size="16">四条路径产出同一份可刷固件,按环境任选</text>
  </g>

  <g transform="translate(56 130)">
    <rect class="panel so" x="0" y="0" width="266" height="120" rx="8" stroke-width="1.5" />
    <text class="mono orange" x="14" y="30" font-size="13" font-weight="600">Docker 构建</text>
    <text class="mono fg" x="14" y="58" font-size="12">docker-build.sh</text>
    <line class="sm" x1="14" y1="72" x2="252" y2="72" stroke-width="1" />
    <text class="sans muted" x="14" y="92" font-size="13">最简单,任意装了</text>
    <text class="sans muted" x="14" y="110" font-size="13">Docker 的系统</text>

    <rect class="panel so" x="286" y="0" width="266" height="120" rx="8" stroke-width="1.5" />
    <text class="mono orange" x="300" y="30" font-size="13" font-weight="600">WSL 构建</text>
    <text class="mono fg" x="300" y="58" font-size="12">wsl-build.sh</text>
    <line class="sm" x1="300" y1="72" x2="538" y2="72" stroke-width="1" />
    <text class="sans muted" x="300" y="92" font-size="13">Windows 推荐,</text>
    <text class="sans muted" x="300" y="110" font-size="13">无需本地 Linux 环境</text>

    <rect class="panel sb" x="572" y="0" width="266" height="120" rx="8" stroke-width="1.5" />
    <text class="mono blue" x="586" y="30" font-size="13" font-weight="600">GitHub Actions 云构建</text>
    <text class="mono fg" x="586" y="58" font-size="12">.github/workflows/</text>
    <line class="sm" x1="586" y1="72" x2="824" y2="72" stroke-width="1" />
    <text class="sans muted" x="586" y="92" font-size="13">Fork 后免费云构建,</text>
    <text class="sans muted" x="586" y="110" font-size="13">Artifacts 下载固件</text>

    <rect class="panel sb" x="858" y="0" width="286" height="120" rx="8" stroke-width="1.5" />
    <text class="mono blue" x="872" y="30" font-size="13" font-weight="600">Linux 本地构建</text>
    <text class="mono fg" x="872" y="58" font-size="12">ImageBuilder + make image</text>
    <line class="sm" x1="872" y1="72" x2="1130" y2="72" stroke-width="1" />
    <text class="sans muted" x="872" y="92" font-size="13">Debian/Ubuntu,</text>
    <text class="sans muted" x="872" y="110" font-size="13">手动控制全流程</text>
  </g>
</svg>
