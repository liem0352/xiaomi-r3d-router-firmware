<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" role="img" aria-labelledby="ft fd5">
  <title id="ft">README 签名</title>
  <desc id="fd5">README MADE WITH 签名,GPL v2 协议,基于 OpenWrt 23.05,作者 liem。</desc>

  <defs>
    <style>
      .bg { fill: #0E1419; }
      .panel { fill: #1A2230; }
      .fg { fill: #E8E4D9; }
      .orange { fill: #F89406; }
      .blue { fill: #4A9EFF; }
      .muted { fill: #6B7280; }
      .so { stroke: #F89406; }
      .sb { stroke: #4A9EFF; }
      .sm { stroke: #6B7280; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="100" rx="20" />

  <g transform="translate(56 36)">
    <rect class="orange" x="0" y="0" width="6" height="28" />
    <text class="mono orange" x="16" y="20" font-size="13" letter-spacing="2">README MADE WITH</text>
    <text class="sans fg" x="16" y="50" font-size="16">设备工业风视觉系统 · 9 SVG 模块</text>
  </g>

  <g transform="translate(700 36)">
    <line class="sm" x1="0" y1="0" x2="444" y2="0" stroke-width="1" />
    <text class="mono muted" x="0" y="20" font-size="11" letter-spacing="1">LICENSE</text>
    <text class="mono fg" x="0" y="40" font-size="13">GPL v2</text>
    <text class="mono muted" x="120" y="20" font-size="11" letter-spacing="1">BASE</text>
    <text class="mono fg" x="120" y="40" font-size="13">OpenWrt 23.05</text>
    <text class="mono muted" x="300" y="20" font-size="11" letter-spacing="1">AUTHOR</text>
    <text class="mono fg" x="300" y="40" font-size="13">liem</text>
  </g>
</svg>
