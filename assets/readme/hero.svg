<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">小米 R3D OpenWrt 路由模式固件</title>
  <desc id="heroDesc">预配置为路由模式的小米 R3D OpenWrt 固件,首次启动即为独立路由器,恢复出厂后仍保持路由模式。默认 LAN 192.168.1.1,DHCP 启用,WiFi 加密。</desc>

  <defs>
    <style>
      .bg { fill: #0E1419; }
      .panel { fill: #1A2230; }
      .fg { fill: #E8E4D9; }
      .orange { fill: #F89406; }
      .blue { fill: #4A9EFF; }
      .muted { fill: #6B7280; }
      .so { stroke: #F89406; }
      .sb { stroke: #4A9EFF; }
      .sm { stroke: #6B7280; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="380" rx="20" />

  <g transform="translate(56 56)">
    <text class="mono orange" x="0" y="14" font-size="13" letter-spacing="2">OPENWRT · ROUTER FIRMWARE</text>
    <text class="sans fg" x="0" y="72" font-size="44" font-weight="700">小米 R3D 路由模式固件</text>
    <text class="sans muted" x="0" y="106" font-size="18">OpenWrt 23.05 / 预配置路由模式 / 恢复出厂保持</text>
    <text class="mono muted" x="0" y="136" font-size="14">LAN 192.168.1.1 / DHCP 100-250 / WiFi 加密</text>
  </g>

  <g transform="translate(720 56)">
    <rect class="panel sb" x="120" y="0" width="180" height="36" rx="6" stroke-width="1.5" />
    <text class="mono blue" x="210" y="23" font-size="12" text-anchor="middle">光猫 / 入户网线</text>

    <line class="sb" x1="210" y1="36" x2="210" y2="64" stroke-width="1.5" />
    <text class="mono blue" x="202" y="55" font-size="10" text-anchor="end">WAN eth0 DHCP</text>

    <rect class="panel so" x="120" y="64" width="180" height="92" rx="6" stroke-width="1.5" />
    <text class="mono orange" x="210" y="96" font-size="22" font-weight="700" text-anchor="middle">R3D</text>
    <text class="mono fg" x="210" y="116" font-size="12" text-anchor="middle">192.168.1.1</text>
    <text class="mono muted" x="210" y="138" font-size="9" text-anchor="middle">br-lan / 4 ports</text>

    <line class="sb" x1="180" y1="156" x2="80" y2="186" stroke-width="1.5" />
    <line class="sb" x1="210" y1="156" x2="210" y2="186" stroke-width="1.5" />
    <line class="sb" x1="240" y1="156" x2="340" y2="186" stroke-width="1.5" />

    <rect class="panel sb" x="20" y="186" width="120" height="36" rx="6" stroke-width="1.5" />
    <text class="mono blue" x="80" y="209" font-size="11" text-anchor="middle">PC</text>

    <rect class="panel sb" x="150" y="186" width="120" height="36" rx="6" stroke-width="1.5" />
    <text class="mono blue" x="210" y="209" font-size="11" text-anchor="middle">交换机</text>

    <rect class="panel sb" x="280" y="186" width="120" height="36" rx="6" stroke-width="1.5" />
    <text class="mono blue" x="340" y="209" font-size="11" text-anchor="middle">设备</text>

    <rect class="panel sm" x="300" y="0" width="120" height="60" rx="6" stroke-width="1" stroke-dasharray="3 3" />
    <text class="mono fg" x="308" y="18" font-size="9">SSID Xiaomi_R3D_5G</text>
    <text class="mono fg" x="308" y="34" font-size="9">PWD 12345678</text>
    <text class="mono fg" x="308" y="50" font-size="9">DHCP 100-250</text>
  </g>

  <text class="mono muted" x="56" y="352" font-size="12">OpenWrt 23.05 / GPL v2 / 作者 liem</text>
</svg>
